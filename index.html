<body class="bg-[#f2f4f0] dark:bg-[#070d07] text-[#0f1a0f] dark:text-[#e1ebe1] transition-colors duration-300 min-h-screen">

  <div id="root"></div>

  <!-- Λογική πηγών (απλή JavaScript) -->
  <script>
    // ===================== ΡΥΘΜΙΣΕΙΣ ΠΗΓΩΝ =====================
    // type "rss"  → κανονικό RSS feed (μέσω rss2json, με εφεδρικό proxy)
    // type "html" → σελίδα που διαβάζεται απευθείας (μέσω proxy) – χρησιμοποιείται για Athletiko
    // Η σειρά μετράει: οι ειδικές σελίδες (ποδόσφαιρο/μπάσκετ) προηγούνται της γενικής ώστε να μπαίνει σωστό άθλημα.
    const SOURCES = [
      { key: "ath-f",  name: "Athletiko", type: "html", url: "https://www.athletiko.gr/panathinaikos-podosfairo", color: "#00a651", sport: "football" },
      { key: "ath-b",  name: "Athletiko", type: "html", url: "https://www.athletiko.gr/panathinaikos-mpasket",    color: "#00a651", sport: "basket" },
      { key: "ath-o",  name: "Athletiko", type: "html", url: "https://www.athletiko.gr/panathinaikos",            color: "#00a651", sport: "other" },
      { key: "pao",    name: "pao.gr",        type: "rss", url: "https://www.pao.gr/feed/",   color: "#0a7d2e", sport: "football" },
      { key: "paobc",  name: "paobc.gr",      type: "rss", url: "https://www.paobc.gr/feed/", color: "#0a3d8a", sport: "basket" },
      { key: "newspao",name: "NewsPao",       type: "rss", url: "https://newspao.gr/feed/",   color: "#0a7d2e", sport: "football" },
      { key: "trif",   name: "Trifilara",     type: "rss", url: "https://trifilara.gr/feed/", color: "#2d8a2d", sport: "football" },
      { key: "sdna",   name: "SDNA PAO",      type: "rss", url: "https://www.sdna.gr/rss/223/panathinaikos", color: "#ffcc00", sport: "football" },
      { key: "gazz",   name: "Gazzetta PAO",  type: "rss", url: "https://www.gazzetta.gr/feed/tags/panathinaikos", color: "#ff6b00", sport: "basket" },
      { key: "sport24",name: "Sport24 PAO",   type: "rss", url: "https://www.sport24.gr/feed/?tag=panathinaikos", color: "#d91e2b", sport: "football" }
    ];

    const PROXIES = [
      (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
      (u) => "https://corsproxy.io/?url=" + encodeURIComponent(u)
    ];

    const LS_CACHE = "pn_cache_v2";
    const LS_TIMES = "pn_times_v1";
    const LS_THEME = "pn_theme";

    function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
    function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

    // ===================== ΒΟΗΘΗΤΙΚΑ =====================
    function clean(s) {
      const t = document.createElement("textarea");
      t.innerHTML = String(s || "");
      return t.value.replace(/\s+/g, " ").trim();
    }

    function parseDate(s) {
      if (!s) return null;
      if (s instanceof Date) return isNaN(s) ? null : s;
      const str = String(s).trim();
      // Το rss2json δίνει "YYYY-MM-DD HH:MM:SS" σε UTC χωρίς ένδειξη ζώνης
      const d = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(str)
        ? new Date(str.replace(" ", "T") + "Z")
        : new Date(str);
      return isNaN(d) ? null : d;
    }

    function firstImg(html) {
      const m = String(html || "").match(/<img[^>]+src=["']([^"']+)["']/i);
      return m ? m[1] : "";
    }

    async function fetchText(url, ms) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms || 9000);
      try {
        const r = await fetch(url, { signal: ctrl.signal });
        if (!r.ok) throw new Error("HTTP " + r.status);
        return await r.text();
      } finally { clearTimeout(t); }
    }

    async function fetchViaProxy(url) {
      let lastErr = new Error("proxy");
      for (const p of PROXIES) {
        try {
          const t = await fetchText(p(url));
          if (t && t.length > 500) return t;
        } catch (e) { lastErr = e; }
      }
      throw lastErr;
    }

    // ===================== RSS =====================
    async function loadRss(src) {
      // 1η προσπάθεια: rss2json
      try {
        const txt = await fetchText("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(src.url));
        const data = JSON.parse(txt);
        if (data.status === "ok" && Array.isArray(data.items) && data.items.length) {
          return data.items.map((item) => ({
            title: clean(item.title),
            link: item.link,
            image: (item.thumbnail) || (item.enclosure && item.enclosure.link) || firstImg(item.content || item.description),
            pubDate: parseDate(item.pubDate)
          }));
        }
      } catch (e) { /* πάμε στο εφεδρικό */ }

      // 2η προσπάθεια: κατέβασμα του XML μέσω proxy
      const xml = await fetchViaProxy(src.url);
      const doc = new DOMParser().parseFromString(xml, "text/xml");
      const nodes = Array.prototype.slice.call(doc.getElementsByTagName("item"));
      if (!nodes.length) throw new Error("Κενό ή μη έγκυρο feed");
      const tag = (el, n) => { const x = el.getElementsByTagName(n)[0]; return x ? x.textContent : ""; };
      const attr = (el, n, a) => { const x = el.getElementsByTagName(n)[0]; return x ? (x.getAttribute(a) || "") : ""; };
      return nodes.map((it) => ({
        title: clean(tag(it, "title")),
        link: (tag(it, "link") || "").trim(),
        image: attr(it, "media:content", "url") || attr(it, "media:thumbnail", "url") || attr(it, "enclosure", "url")
               || firstImg(tag(it, "content:encoded") || tag(it, "description")),
        pubDate: parseDate(tag(it, "pubDate"))
      }));
    }

    // ===================== ATHLETIKO (ανάγνωση σελίδας) =====================
    const ATH_RE = /^https?:\/\/(www\.)?athletiko\.gr\/[^\/?#]+-\d{4,7}\/?$/;
    const TIME_RE = /πριν\s+\d+\s+(δευτ|λεπτ|ώρ|ημέρ|εβδομ)|\d{2}\.\d{2}\.\d{4}/i;

    function normLink(h) {
      h = String(h || "").split("#")[0].split("?")[0];
      if (h.indexOf("/") === 0) h = "https://www.athletiko.gr" + h;
      h = h.replace(/^http:\/\//, "https://").replace("//athletiko.gr", "//www.athletiko.gr").replace(/\/$/, "");
      return ATH_RE.test(h) ? h : "";
    }

    function countArticleLinks(box) {
      const s = {};
      Array.prototype.forEach.call(box.querySelectorAll("a[href]"), (a) => {
        const h = normLink(a.getAttribute("href"));
        if (h) s[h] = 1;
      });
      return Object.keys(s).length;
    }

    // Ανεβαίνει από ένα στοιχείο μέχρι να βρει "κάρτα" που ικανοποιεί το pred και περιέχει ΜΟΝΟ ένα άρθρο
    function climb(el, pred) {
      let box = el;
      for (let i = 0; i < 7 && box.parentElement; i++) {
        box = box.parentElement;
        if (countArticleLinks(box) > 1) return null;
        if (pred(box)) return box;
      }
      return null;
    }

    function pickImg(box) {
      const imgs = box.querySelectorAll("img");
      for (let i = 0; i < imgs.length; i++) {
        const im = imgs[i];
        const cands = [im.getAttribute("data-src"), im.getAttribute("data-lazy-src"), im.getAttribute("data-original"), im.getAttribute("src")];
        const ss = im.getAttribute("srcset");
        if (ss) cands.push(ss.split(",")[0].trim().split(" ")[0]);
        for (let j = 0; j < cands.length; j++) {
          let c = cands[j];
          if (!c || /placeholder|data:image/i.test(c)) continue;
          if (c.indexOf("//") === 0) c = "https:" + c;
          if (/^https?:\/\//.test(c)) return c;
        }
      }
      return "";
    }

    function relDate(text, now) {
      let m = text.match(/πριν\s+(\d+)\s+(δευτ|λεπτ|ώρ|ημέρ|εβδομ)/i);
      if (m) {
        const n = +m[1], u = m[2].toLowerCase();
        const ms = u.indexOf("δευτ") === 0 ? 1e3 : u.indexOf("λεπτ") === 0 ? 6e4 : u.indexOf("ώρ") === 0 ? 36e5 : u.indexOf("ημέρ") === 0 ? 864e5 : 6048e5;
        return new Date(now - n * ms);
      }
      m = text.match(/(\d{2})\.(\d{2})\.(\d{4})/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1], 12, 0);
      return null;
    }

    function parseAthletiko(html) {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const now = Date.now();
      const recs = {};
      const list = [];
      Array.prototype.forEach.call(doc.querySelectorAll("a[href]"), (a) => {
        const href = normLink(a.getAttribute("href"));
        if (!href) return;
        let r = recs[href];
        if (!r) { r = { link: href, title: "", el: a, order: list.length }; recs[href] = r; list.push(r); }
        const inHeading = !!a.closest("h1,h2,h3,h4");
        const txt = (a.textContent || "").trim();
        const ttl = (a.getAttribute("title") || "").trim();
        const cand = inHeading && txt ? txt : (ttl || txt);
        if (cand && cand.charAt(0) !== "/" && cand.indexOf("http") !== 0) {
          if (inHeading || !r.title) r.title = cand;
        }
        if (inHeading) r.el = a;
      });

      const times = lsGet(LS_TIMES, {});
      const out = [];
      list.forEach((r) => {
        if (!r.title) return;
        const tBox = climb(r.el, (b) => TIME_RE.test(b.textContent));
        const iBox = climb(r.el, (b) => !!pickImg(b));
        let date = tBox ? relDate(tBox.textContent, now) : null;
        if (!date) date = new Date(now - (r.order + 1) * 10 * 60e3);
        // Σταθεροποίηση: η "πριν 2 ώρες" δεν πρέπει να μετακινείται σε κάθε ανανέωση
        if (times[r.link]) date = new Date(times[r.link]); else times[r.link] = date.toISOString();
        out.push({ title: clean(r.title), link: r.link, image: iBox ? pickImg(iBox) : "", pubDate: date });
      });
      const keys = Object.keys(times);
      if (keys.length > 600) {
        keys.sort((a, b) => times[a] < times[b] ? -1 : 1).slice(0, keys.length - 600).forEach((k) => delete times[k]);
      }
      lsSet(LS_TIMES, times);
      return out;
    }

    async function loadAthletiko(src) {
      const html = await fetchViaProxy(src.url);
      const items = parseAthletiko(html);
      if (!items.length) throw new Error("Δεν βρέθηκαν άρθρα (άλλαξε η δομή της σελίδας;)");
      return items;
    }

    // ===================== ΜΟΡΦΟΠΟΙΗΣΗ =====================
    function fmtTime(d) {
      if (!d) return "Πρόσφατα";
      const now = new Date();
      const hm = d.toLocaleTimeString("el-GR", { hour: "2-digit", minute: "2-digit" });
      if (d.toDateString() === now.toDateString()) return hm;
      return d.toLocaleDateString("el-GR", { day: "2-digit", month: "2-digit" }) + " " + hm;
    }

    function decorate(it, src) {
      let d = it.pubDate;
      const now = Date.now();
      if (!d || d.getTime() > now + 5 * 60e3) d = new Date(now); // άκυρη ή "μελλοντική" ημερομηνία
      return { id: src.key + "|" + it.link, title: it.title, link: it.link, image: it.image || "",
               source: src.name, color: src.color, sport: src.sport, pubDate: d };
    }

    function mergeNews(sourceData) {
      const all = [];
      Object.keys(sourceData).forEach((k) => { sourceData[k].forEach((i) => all.push(i)); });
      const byLink = {};
      all.forEach((it) => {
        const k = it.link.replace(/\/$/, "").toLowerCase();
        const ex = byLink[k];
        if (!ex) byLink[k] = it;
        else {
          const betterSport = ex.sport === "other" && it.sport !== "other";
          const worseSport = it.sport === "other" && ex.sport !== "other";
          const betterImg = !ex.image && it.image;
          if (betterSport || (betterImg && !worseSport)) byLink[k] = Object.assign({}, it, { image: it.image || ex.image });
        }
      });
      const seen = {};
      return Object.keys(byLink).map((k) => byLink[k])
        .sort((a, b) => b.pubDate - a.pubDate)
        .filter((it) => {
          const k = it.title.toLowerCase().replace(/[^a-z0-9α-ωά-ώ]+/g, "");
          if (!k || seen[k]) return false;
          seen[k] = 1; return true;
        });
    }

    // Τρέχει τη λίστα με περιορισμένο παραλληλισμό (για να μη μας μπλοκάρουν οι δωρεάν υπηρεσίες)
    async function runLimited(list, limit, fn) {
      let i = 0;
      const workers = [];
      for (let w = 0; w < Math.min(limit, list.length); w++) {
        workers.push((async () => { while (i < list.length) { const x = list[i++]; await fn(x); } })());
      }
      await Promise.all(workers);
    }

    // Διαβάζει το news.json που φτιάχνει αυτόματα το GitHub (με φωτογραφίες, χωρίς proxies)
    async function loadServerNews() {
      const r = await fetch("./news.json?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const groups = {};
      (j.items || []).forEach((i) => {
        const d = parseDate(i.pubDate) || new Date();
        const key = "srv:" + i.source;
        (groups[key] = groups[key] || []).push({
          id: "srv|" + i.link, title: i.title, link: i.link, image: i.image || "",
          source: i.source, color: i.color, sport: i.sport, pubDate: d
        });
      });
      return { groups: groups, sources: j.sources || {}, updated: parseDate(j.updated) };
    }
  </script>

  <!-- Εφαρμογή (React) -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Εγγραφή Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }

    // Εορτολόγιο
    const NAMEDAYS_MAP = {
      "01-01": "Βασίλης, Βασιλική", "01-06": "Φώτης, Φωτεινή, Ιορδάνης", "01-07": "Γιάννης, Ιωάννα",
      "01-17": "Αντώνης, Αντωνία", "01-18": "Θανάσης, Αθανασία", "01-25": "Γρηγόρης, Γρηγορία",
      "02-10": "Χαράλαμπος, Χαρά", "02-14": "Βαλεντίνος, Βαλεντίνα", "03-25": "Βαγγέλης, Ευαγγελία",
      "04-23": "Γιώργος, Γεωργία", "05-21": "Κώστας, Ελένη", "06-29": "Πέτρος, Παύλος",
      "07-17": "Μαρίνα", "07-20": "Ηλίας", "07-26": "Παρασκευή", "08-15": "Μαρία, Μάριος, Παναγιώτης, Δέσποινα",
      "08-30": "Αλέξανδρος, Αλεξάνδρα", "09-17": "Σοφία, Πίστη, Ελπίδα, Αγάπη", "09-22": "Φωκάς, Λωΐς, Ιωνάς",
      "10-26": "Δημήτρης, Δήμητρα", "11-08": "Μιχάλης, Άγγελος, Αγγελική", "11-25": "Κατερίνα",
      "11-30": "Ανδρέας, Ανδριάνα", "12-06": "Νίκος, Νικολέτα", "12-09": "Άννα", "12-12": "Σπύρος, Σπυριδούλα",
      "12-25": "Χρήστος, Χριστίνα, Μανώλης"
    };

    function getTodayNameDays() {
      const today = new Date();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return NAMEDAYS_MAP[`${mm}-${dd}`] || "Δεν υπάρχει κάποια μεγάλη γνωστή γιορτή σήμερα";
    }

    function getWeatherDescription(code) {
      if (code === 0) return "☀️ Αίθριος";
      if (code >= 1 && code <= 3) return "⛅ Συννεφιά";
      if (code >= 45 && code <= 48) return "🌫️ Ομίχλη";
      if (code >= 51 && code <= 67) return "🌧️ Βροχή";
      if (code >= 71 && code <= 77) return "❄️ Χιόνι";
      if (code >= 95) return "⛈️ Καταιγίδα";
      return "🌤️ Ηλιόλουστος";
    }

    // Ρολόι σε δικό του component, ώστε να μην ξαναζωγραφίζεται όλη η λίστα κάθε δευτερόλεπτο
    function DateBanner() {
      const [now, setNow] = useState(new Date());
      useEffect(() => {
        const t = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(t);
      }, []);
      const formattedDate = now.toLocaleDateString('el-GR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      return (
        <section className="p-4 rounded-2xl bg-gradient-to-r from-amber-500/20 via-pao-green/20 to-emerald-500/20 border-2 border-amber-400 dark:border-amber-500/60 shadow-md">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <span className="text-2xl">📅</span>
              <div>
                <div className="text-xs font-extrabold uppercase text-amber-700 dark:text-amber-300">ΣΗΜΕΡΙΝΗ ΗΜΕΡΟΜΗΝΙΑ</div>
                <div className="text-sm md:text-base font-black capitalize">
                  {formattedDate} • <span className="font-mono text-pao-green dark:text-emerald-400">{now.toLocaleTimeString('el-GR')}</span>
                </div>
              </div>
            </div>
            <div className="flex items-center gap-3 p-2.5 rounded-xl bg-white/80 dark:bg-black/60 border border-amber-400/40">
              <span className="text-2xl">🎉</span>
              <div>
                <div className="text-xs font-black uppercase text-amber-600 dark:text-amber-400">ΓΙΟΡΤΑΖΟΥΝ ΣΗΜΕΡΑ:</div>
                <div className="text-sm font-extrabold text-pao-green dark:text-emerald-300">{getTodayNameDays()}</div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function NewsImage({ src, alt }) {
      const [bad, setBad] = useState(false);
      if (!src || bad) {
        return <div className="w-full h-full flex items-center justify-center text-5xl bg-gradient-to-br from-pao-darkgreen to-pao-green">☘️</div>;
      }
      return (
        <img src={src} alt={alt} loading="lazy" referrerPolicy="no-referrer"
          className="w-full h-full object-cover hover:scale-105 transition duration-300"
          onError={() => setBad(true)} />
      );
    }

    function loadCachedSourceData() {
      const c = lsGet(LS_CACHE, null);
      const out = {};
      if (c && c.data) {
        Object.keys(c.data).forEach((k) => {
          out[k] = c.data[k].map((i) => Object.assign({}, i, { pubDate: new Date(i.pubDate) }));
        });
      }
      return { data: out, savedAt: c && c.savedAt ? new Date(c.savedAt) : null };
    }

    function App() {
      const cached = useMemo(loadCachedSourceData, []);
      const [isDark, setIsDark] = useState(() => lsGet(LS_THEME, true));
      const [sourceData, setSourceData] = useState(cached.data);
      const [status, setStatus] = useState({});
      const [serverStatus, setServerStatus] = useState({});
      const [refreshing, setRefreshing] = useState(true);
      const [lastUpdate, setLastUpdate] = useState(cached.savedAt);
      const [online, setOnline] = useState(navigator.onLine);
      const [filter, setFilter] = useState("all");
      const [sourceFilter, setSourceFilter] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      const [limit, setLimit] = useState(36);
      const [weather, setWeather] = useState({ city: "Αθήνα", temp: "--°C", text: "🌤️ Φόρτωση..." });
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const busy = useRef(false);
      const lastRun = useRef(0);

      useEffect(() => {
        const h = (e) => { e.preventDefault(); setDeferredPrompt(e); };
        window.addEventListener('beforeinstallprompt', h);
        return () => window.removeEventListener('beforeinstallprompt', h);
      }, []);

      const handleInstallApp = () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(() => setDeferredPrompt(null));
        } else {
          alert("Για να το κάνεις App στο κινητό:\n\n• Στο Chrome: Πάτα τις 3 τελείες (⋮) -> 'Προσθήκη στην αρχική οθόνη' / 'Εγκατάσταση εφαρμογής'\n• Στο Safari (iPhone): Πάτα 'Κοινοποίηση' (Share) -> 'Προσθήκη στην οθόνη αφετηρίας'");
        }
      };

      const shareOnTwitter = (title, link) => {
        const text = encodeURIComponent(`☘️ ${title}\n\n`);
        const url = encodeURIComponent(link);
        const hashtags = encodeURIComponent("Panathinaikos,PAOFCC,PAOBC");
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}&hashtags=${hashtags}`, '_blank');
      };

      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
        lsSet(LS_THEME, isDark);
      }, [isDark]);

      useEffect(() => {
        const on = () => setOnline(true), off = () => setOnline(false);
        window.addEventListener('online', on); window.addEventListener('offline', off);
        return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
      }, []);

      useEffect(() => {
        const fetchWeather = async (lat, lon, cityName) => {
          try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
            const data = await res.json();
            if (data.current_weather) {
              setWeather({
                city: cityName,
                temp: `${Math.round(data.current_weather.temperature)}°C`,
                text: getWeatherDescription(data.current_weather.weathercode)
              });
            }
          } catch (e) {
            setWeather({ city: cityName, temp: "--°C", text: "" });
          }
        };
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude, "Τοποθεσία σου"),
            () => fetchWeather(37.9838, 23.7275, "Αθήνα")
          );
        } else {
          fetchWeather(37.9838, 23.7275, "Αθήνα");
        }
      }, []);

      // 1) Διαβάζει το news.json (έτοιμο από το GitHub)  2) Για πηγές που απέτυχαν εκεί, δοκιμάζει ζωντανά από τον browser
      const refresh = async () => {
        if (busy.current) return;
        busy.current = true;
        setRefreshing(true);
        let srvSources = {};
        try {
          const srv = await loadServerNews();
          srvSources = srv.sources;
          setServerStatus(srv.sources);
          setSourceData((prev) => Object.assign({}, prev, srv.groups));
        } catch (e) {
          setServerStatus({ __file: { ok: false, msg: String((e && e.message) || e) } });
        }
        const need = SOURCES.filter((s) => !(srvSources[s.name] && srvSources[s.name].ok));
        await runLimited(need, 2, async (src) => {
          try {
            const items = src.type === "html" ? await loadAthletiko(src) : await loadRss(src);
            const decorated = items.filter((i) => i.title && i.link).map((i) => decorate(i, src));
            setSourceData((prev) => Object.assign({}, prev, { [src.key]: decorated }));
            setStatus((prev) => Object.assign({}, prev, { [src.key]: { ok: true, n: decorated.length } }));
          } catch (e) {
            setStatus((prev) => Object.assign({}, prev, { [src.key]: { ok: false, msg: String((e && e.message) || e) } }));
          }
        });
        lastRun.current = Date.now();
        setLastUpdate(new Date());
        setRefreshing(false);
        busy.current = false;
      };

      useEffect(() => {
        refresh();
        const interval = setInterval(() => { if (!document.hidden && navigator.onLine) refresh(); }, 300000);
        const onVisible = () => { if (!document.hidden && Date.now() - lastRun.current > 180000) refresh(); };
        const onOnline = () => refresh();
        document.addEventListener('visibilitychange', onVisible);
        window.addEventListener('online', onOnline);
        return () => {
          clearInterval(interval);
          document.removeEventListener('visibilitychange', onVisible);
          window.removeEventListener('online', onOnline);
        };
      }, []);

      const news = useMemo(() => mergeNews(sourceData), [sourceData]);

      // Αποθήκευση για offline / άμεση εμφάνιση στο επόμενο άνοιγμα
      useEffect(() => {
        if (!news.length) return;
        const data = {};
        Object.keys(sourceData).forEach((k) => { data[k] = sourceData[k].slice(0, 25); });
        lsSet(LS_CACHE, { savedAt: new Date().toISOString(), data });
      }, [sourceData]);

      const counts = useMemo(() => ({
        all: news.length,
        football: news.filter((n) => n.sport === "football").length,
        basket: news.filter((n) => n.sport === "basket").length,
        other: news.filter((n) => n.sport === "other").length
      }), [news]);

      const sourceNames = useMemo(() => {
        const seen = {}; const out = [];
        SOURCES.forEach((s) => { if (!seen[s.name]) { seen[s.name] = 1; out.push(s.name); } });
        return out;
      }, []);

      const filteredNews = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return news.filter((item) => {
          if (filter !== "all" && item.sport !== filter) return false;
          if (sourceFilter !== "all" && item.source !== sourceFilter) return false;
          if (q && !item.title.toLowerCase().includes(q)) return false;
          return true;
        });
      }, [news, filter, sourceFilter, searchQuery]);

      useEffect(() => { setLimit(36); }, [filter, sourceFilter, searchQuery]);

      const sourceChips = sourceNames.map((name) => {
        const keys = SOURCES.filter((s) => s.name === name).map((s) => s.key);
        const sts = [];
        if (serverStatus[name]) sts.push(serverStatus[name]);
        keys.forEach((k) => { if (status[k]) sts.push(status[k]); });
        let state = "wait", msg = "";
        if (sts.length) {
          if (sts.some((s) => s.ok)) state = "ok";
          else { state = "err"; msg = sts.map((s) => s.msg).filter(Boolean)[0] || "Σφάλμα"; }
        }
        return { name, state, msg };
      });
      const okCount = sourceChips.filter((c) => c.state === "ok").length;
      const errChips = sourceChips.filter((c) => c.state === "err");
      const allFailed = !refreshing && news.length === 0;

      const chipCls = (active) => `px-4 py-2 rounded-xl text-xs font-black transition whitespace-nowrap ${active ? 'bg-pao-green text-white' : 'bg-black/5 dark:bg-white/5'}`;
      const NEW_MS = 45 * 60 * 1000;

      return (
        <div className="max-w-7xl mx-auto px-4 py-4 space-y-5">

          {/* HEADER BAR */}
          <header className="flex flex-wrap items-center justify-between gap-4 p-4 rounded-2xl bg-white dark:bg-[#111c11] border border-black/10 dark:border-white/10 shadow-sm">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-2xl bg-pao-green flex items-center justify-center text-2xl shadow-lg shadow-pao-green/30">☘️</div>
              <div>
                <h1 className="text-xl md:text-2xl font-black tracking-tight">Πράσινα Νέα ☘️</h1>
                <p className="text-xs font-bold text-pao-green dark:text-emerald-400">ΜΟΝΟ ΠΑΝΑΘΗΝΑΪΚΟΣ • LIVE ΑΠΟ {sourceNames.length} ΠΗΓΕΣ</p>
              </div>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              <button onClick={handleInstallApp}
                className="px-3 py-1.5 rounded-xl bg-pao-green/10 text-pao-green dark:text-emerald-400 border border-pao-green/20 text-xs font-black hover:bg-pao-green/20 transition flex items-center gap-1.5">
                <span>📱</span> Εγκατάσταση App
              </button>

              <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-black/5 dark:bg-white/5 text-xs font-bold border border-black/5 dark:border-white/5">
                <span>📍 {weather.city}</span>
                <span className="text-pao-green dark:text-emerald-400 font-extrabold">{weather.temp}</span>
                <span>{weather.text}</span>
              </div>

              <button onClick={refresh} disabled={refreshing} title="Ανανέωση"
                className="px-3 py-1.5 rounded-xl bg-pao-green text-white text-xs font-bold hover:opacity-90 transition disabled:opacity-60">
                <span className={refreshing ? "inline-block animate-spin" : "inline-block"}>🔄</span>
              </button>

              <button onClick={() => setIsDark(!isDark)}
                className="w-10 h-10 rounded-xl bg-black/5 dark:bg-white/10 flex items-center justify-center text-lg hover:scale-105 transition">
                {isDark ? '☀️' : '🌙'}
              </button>
            </div>
          </header>

          <DateBanner />

          {!online && (
            <div className="p-3 rounded-2xl bg-amber-500/15 border border-amber-500/40 text-xs font-bold">
              📴 Είσαι offline — εμφανίζονται οι τελευταίες αποθηκευμένες ειδήσεις{lastUpdate ? ` (${fmtTime(lastUpdate)})` : ""}.
            </div>
          )}

          {/* ΦΙΛΤΡΑ & ΑΝΑΖΗΤΗΣΗ */}
          <div className="space-y-3 p-3 rounded-2xl bg-white dark:bg-[#111c11] border border-black/10 dark:border-white/10">
            <div className="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3">
              <div className="flex items-center gap-2 overflow-x-auto pb-1 lg:pb-0">
                <button onClick={() => setFilter("all")} className={chipCls(filter === 'all')}>Όλα ☘️ ({counts.all})</button>
                <button onClick={() => setFilter("football")} className={chipCls(filter === 'football')}>⚽ Ποδόσφαιρο ({counts.football})</button>
                <button onClick={() => setFilter("basket")} className={chipCls(filter === 'basket')}>🏀 Μπάσκετ ({counts.basket})</button>
                <button onClick={() => setFilter("other")} className={chipCls(filter === 'other')}>🏐 Άλλα ({counts.other})</button>
              </div>

              <div className="flex items-center gap-2">
                <select value={sourceFilter} onChange={(e) => setSourceFilter(e.target.value)}
                  className="px-3 py-2 rounded-xl bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 text-xs font-bold outline-none">
                  <option value="all">Όλες οι πηγές</option>
                  {sourceNames.map((n) => <option key={n} value={n}>{n}</option>)}
                </select>
                <input type="text" placeholder="Αναζήτηση ειδήσεων..." value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full sm:w-56 px-4 py-2 rounded-xl bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 text-xs font-bold outline-none focus:border-pao-green" />
              </div>
            </div>
          </div>

          {/* ΛΙΣΤΑ ΕΙΔΗΣΕΩΝ */}
          <section className="space-y-3">
            {news.length === 0 && refreshing ? (
              <div className="text-center py-12 text-sm font-bold opacity-60">Αντλούνται οι τελευταίες ειδήσεις... ☘️</div>
            ) : news.length === 0 && allFailed ? (
              <div className="text-center py-12 space-y-3">
                <div className="text-sm font-bold">Δεν μπόρεσαν να φορτωθούν ειδήσεις από καμία πηγή.</div>
                <div className="text-xs opacity-60">Έλεγξε τη σύνδεσή σου. Ενδέχεται να έχει φτάσει το όριο χρήσης η δωρεάν υπηρεσία RSS.</div>
                <button onClick={refresh} className="px-4 py-2 rounded-xl bg-pao-green text-white text-xs font-black">Δοκίμασε ξανά</button>
              </div>
            ) : filteredNews.length === 0 ? (
              <div className="text-center py-12 text-sm font-bold opacity-60">Δεν βρέθηκαν ειδήσεις.</div>
            ) : (
              <>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredNews.slice(0, limit).map(item => (
                    <article key={item.id} className="p-4 rounded-2xl bg-white dark:bg-[#111c11] border border-black/10 dark:border-white/10 hover:border-pao-green transition flex flex-col justify-between space-y-3">
                      <div className="space-y-3">
                        <div className="relative rounded-xl overflow-hidden h-40 bg-black/10">
                          <NewsImage src={item.image} alt={item.title} />
                          <span className="absolute top-2 left-2 px-2.5 py-0.5 rounded-full text-[10px] font-black text-white shadow" style={{ backgroundColor: item.color }}>
                            {item.source}
                          </span>
                          {Date.now() - item.pubDate.getTime() < NEW_MS && (
                            <span className="absolute top-2 right-2 px-2 py-0.5 rounded-full bg-red-600 text-white text-[10px] font-black shadow">ΝΕΟ</span>
                          )}
                          <span className="absolute bottom-2 right-2 px-2 py-0.5 rounded bg-black/70 text-white text-[10px] font-bold backdrop-blur">
                            {fmtTime(item.pubDate)}
                          </span>
                        </div>
                        <h3 className="text-sm font-extrabold leading-snug hover:text-pao-green transition">
                          <a href={item.link} target="_blank" rel="noopener noreferrer">{item.title}</a>
                        </h3>
                      </div>

                      <div className="pt-2 border-t border-black/5 dark:border-white/5 flex items-center justify-between text-xs font-bold">
                        <a href={item.link} target="_blank" rel="noopener noreferrer" className="text-pao-green dark:text-emerald-400 hover:underline">Διάβασε →</a>
                        <button onClick={() => shareOnTwitter(item.title, item.link)}
                          className="px-2.5 py-1 rounded-lg bg-black/5 dark:bg-white/10 hover:bg-sky-500 hover:text-white transition flex items-center gap-1 text-[11px] font-black">
                          <span>🐦</span> Tweet
                        </button>
                      </div>
                    </article>
                  ))}
                </div>
                {filteredNews.length > limit && (
                  <div className="text-center pt-2">
                    <button onClick={() => setLimit(limit + 36)} className="px-5 py-2 rounded-xl bg-pao-green text-white text-xs font-black">
                      Περισσότερα ({filteredNews.length - limit})
                    </button>
                  </div>
                )}
              </>
            )}
          </section>

          {/* ΚΑΤΑΣΤΑΣΗ ΠΗΓΩΝ */}
          <section className="p-3 rounded-2xl bg-white dark:bg-[#111c11] border border-black/10 dark:border-white/10 space-y-2">
            <div className="flex items-center justify-between text-[11px] font-black opacity-70">
              <span>ΚΑΤΑΣΤΑΣΗ ΠΗΓΩΝ ({okCount}/{sourceChips.length})</span>
              <span>{lastUpdate ? `Τελευταία ενημέρωση: ${fmtTime(lastUpdate)}` : ""}</span>
            </div>
            <div className="flex flex-wrap gap-2">
              {sourceChips.map((c) => (
                <span key={c.name}
                  className={`px-2.5 py-1 rounded-full text-[11px] font-bold border ${c.state === 'ok' ? 'border-emerald-500/40 text-emerald-700 dark:text-emerald-300' : c.state === 'err' ? 'border-red-500/50 text-red-600 dark:text-red-400' : 'border-black/10 dark:border-white/10 opacity-60'}`}>
                  {c.state === 'ok' ? '✓' : c.state === 'err' ? '✗' : '…'} {c.name}
                </span>
              ))}
            </div>
            {errChips.length > 0 && (
              <div className="text-[10px] font-bold opacity-70 space-y-0.5 pt-1">
                {errChips.map((c) => <div key={c.name}>✗ {c.name}: {c.msg}</div>)}
                {serverStatus.__file && <div>ℹ️ news.json: {serverStatus.__file.msg}</div>}
              </div>
            )}
          </section>

          <footer className="text-center py-6 text-xs font-bold opacity-50 space-y-1">
            <p>☘️ Πράσινα Νέα • Μόνο Παναθηναϊκός • 2026</p>
            <p>Live ειδήσεις από τις κορυφαίες πράσινες πηγές</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
