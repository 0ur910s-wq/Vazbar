<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Πράσινα Νέα ☘️ - Μόνο Παναθηναϊκός Live RSS</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0a7d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Πράσινα Νέα">
  <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=180&q=80">
  
  <link rel="manifest" href="./manifest.json">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pao: {
              green: '#0a7d2e',
              darkgreen: '#054719',
              lightgreen: '#10b981',
              navy: '#0a3d8a'
            }
          }
        }
      }
    }
  </script>
  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#f2f4f0] dark:bg-[#070d07] text-[#0f1a0f] dark:text-[#e1ebe1] transition-colors duration-300 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Εγγραφή Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }

    // Εορτολόγιο
    const NAMEDAYS_MAP = {
      "01-01": "Βασίλης, Βασιλική", "01-06": "Φώτης, Φωτεινή, Ιορδάνης", "01-07": "Γιάννης, Ιωάννα",
      "01-17": "Αντώνης, Αντωνία", "01-18": "Θανάσης, Αθανασία", "01-25": "Γρηγόρης, Γρηγορία",
      "02-10": "Χαράλαμπος, Χαρά", "02-14": "Βαλεντίνος, Βαλεντίνα", "03-25": "Βαγγέλης, Ευαγγελία",
      "04-23": "Γιώργος, Γεωργία", "05-21": "Κώστας, Ελένη", "06-29": "Πέτρος, Παύλος",
      "07-17": "Μαρίνα", "07-20": "Ηλίας", "07-26": "Παρασκευή", "08-15": "Μαρία, Μάριος, Παναγιώτης, Δέσποινα",
      "08-30": "Αλέξανδρος, Αλεξάνδρα", "09-17": "Σοφία, Πίστη, Ελπίδα, Αγάπη", "09-22": "Φωκάς, Λωΐς, Ιωνάς",
      "10-26": "Δημήτρης, Δήμητρα", "11-08": "Μιχάλης, Άγγελος, Αγγελική", "11-25": "Κατερίνα",
      "11-30": "Ανδρέας, Ανδριάνα", "12-06": "Νίκος, Νικολέτα", "12-09": "Άννα", "12-12": "Σπύρος, Σπυριδούλα",
      "12-25": "Χρήστος, Χριστίνα, Μανώλης"
    };

    function getTodayNameDays() {
      const today = new Date();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return NAMEDAYS_MAP[`${mm}-${dd}`] || "Δεν υπάρχει κάποια μεγάλη γνωστή γιορτή σήμερα";
    }

    // Πηγές RSS
    const RSS_FEEDS = [
      { key: "pao.gr", name: "pao.gr", url: "https://www.pao.gr/feed/", color: "#0a7d2e", sport: "football" },
      { key: "paobc.gr", name: "paobc.gr", url: "https://www.paobc.gr/feed/", color: "#0a3d8a", sport: "basket" },
      { key: "NewsPao", name: "NewsPao", url: "https://newspao.gr/feed/", color: "#0a7d2e", sport: "football" },
      { key: "Trifilara", name: "Trifilara", url: "https://trifilara.gr/feed/", color: "#2d8a2d", sport: "football" },
      { key: "SDNA", name: "SDNA PAO", url: "https://www.sdna.gr/rss/223/panathinaikos", color: "#ffcc00", sport: "football" },
      { key: "Gazzetta", name: "Gazzetta PAO", url: "https://www.gazzetta.gr/feed/tags/panathinaikos", color: "#ff6b00", sport: "basket" },
      { key: "Sport24", name: "Sport24 PAO", url: "https://www.sport24.gr/feed/?tag=panathinaikos", color: "#d91e2b", sport: "football" }
    ];

    function getWeatherDescription(code) {
      if (code === 0) return "☀️ Αίθριος";
      if (code >= 1 && code <= 3) return "⛅ Συννεφιά";
      if (code >= 45 && code <= 48) return "🌫️ Ομίχλη";
      if (code >= 51 && code <= 67) return "🌧️ Βροχή";
      if (code >= 71 && code <= 77) return "❄️ Χιόνι";
      if (code >= 95) return "⛈️ Καταιγίδα";
      return "🌤️ Ηλιόλουστος";
    }

    function extractImage(item) {
      if (item.thumbnail) return item.thumbnail;
      if (item.enclosure && item.enclosure.link) return item.enclosure.link;
      
      const htmlContent = item.content || item.description || "";
      const imgMatch = htmlContent.match(/<img[^>]+src=["']([^"']+)["']/i);
      if (imgMatch && imgMatch[1]) {
        return imgMatch[1];
      }
      
      return "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=300&q=80";
    }

    function App() {
      const [isDark, setIsDark] = useState(true);
      const [news, setNews] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filter, setFilter] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      const [weather, setWeather] = useState({ city: "Αθήνα", temp: "--°C", text: "🌤️ Φόρτωση..." });
      const [currentTime, setCurrentTime] = useState(new Date());
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      useEffect(() => {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        });
      }, []);

      const handleInstallApp = () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('Ο χρήστης εγκατέστησε το App!');
            }
            setDeferredPrompt(null);
          });
        } else {
          alert("Για να το κάνεις App στο κινητό:\n\n• Στο Chrome: Πάτα τις 3 τελείες (⋮) -> 'Δημιουργία συντόμευσης' / 'Προσθήκη στην οθόνη αφετηρίας'\n• Στο Safari (iPhone): Πάτα 'Κοινοποίηση' (Share) -> 'Προσθήκη στην οθόνη αφετηρίας'");
        }
      };

      const shareOnTwitter = (title, link) => {
        const text = encodeURIComponent(`☘️ ${title}\n\n`);
        const url = encodeURIComponent(link);
        const hashtags = encodeURIComponent("Panathinaikos,PAOFCC,PAOBC");
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}&hashtags=${hashtags}`, '_blank');
      };

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
      }, [isDark]);

      useEffect(() => {
        const fetchWeather = async (lat, lon, cityName) => {
          try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
            const data = await res.json();
            if (data.current_weather) {
              setWeather({
                city: cityName,
                temp: `${Math.round(data.current_weather.temperature)}°C`,
                text: getWeatherDescription(data.current_weather.weathercode)
              });
            }
          } catch (e) {
            setWeather({ city: "Αθήνα", temp: "22°C", text: "☀️ Αίθριος" });
          }
        };

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude, "Τοποθεσία σου"),
            () => fetchWeather(37.9838, 23.7275, "Αθήνα")
          );
        } else {
          fetchWeather(37.9838, 23.7275, "Αθήνα");
        }
      }, []);

      const fetchLiveNews = async () => {
        setLoading(true);
        let allItems = [];

        for (const feed of RSS_FEEDS) {
          try {
            const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`);
            const data = await res.json();

            if (data.status === 'ok' && data.items) {
              const fetched = data.items.map((item, idx) => ({
                id: `${feed.key}-${idx}-${item.guid || item.link}`,
                title: item.title,
                link: item.link,
                image: extractImage(item),
                source: feed.name,
                color: feed.color,
                sport: feed.sport,
                pubDate: new Date(item.pubDate),
                time: item.pubDate ? new Date(item.pubDate).toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' }) : 'Πρόσφατα'
              }));
              allItems = [...allItems, ...fetched];
            }
          } catch (e) {
            console.error("Error fetching " + feed.name, e);
          }
        }

        allItems.sort((a, b) => b.pubDate - a.pubDate);

        if (allItems.length > 0) {
          setNews(allItems);
        } else {
          setNews([
            { id: 1, title: "Παναθηναϊκός: Ολοκληρώθηκε η προετοιμασία στο Κορωπί", image: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=300&q=80", source: "pao.gr", link: "https://www.pao.gr", time: "12:00", sport: "football", color: "#0a7d2e", pubDate: new Date() },
            { id: 2, title: "Παναθηναϊκός AKTOR: Πανέτοιμο το ΟΑΚΑ για την πρεμιέρα", image: "https://images.unsplash.com/photo-1546519638-68e109498ffc?w=300&q=80", source: "paobc.gr", link: "https://www.paobc.gr", time: "11:45", sport: "basket", color: "#0a3d8a", pubDate: new Date() }
          ]);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchLiveNews();
        const interval = setInterval(fetchLiveNews, 180000);
        return () => clearInterval(interval);
      }, []);

      const filteredNews = useMemo(() => {
        return news.filter(item => {
          if (filter === "football" && item.sport !== "football") return false;
          if (filter === "basket" && item.sport !== "basket") return false;
          if (searchQuery.trim() !== "") {
            return item.title.toLowerCase().includes(searchQuery.toLowerCase());
          }
          return true;
        });
      }, [news, filter, searchQuery]);

      const formattedDate = currentTime.toLocaleDateString('el-GR', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });

      return (
        <div className="max-w-7xl mx-auto px-4 py-4 space-y-5">
          
          {/* HEADER BAR */}
          <header className="flex flex-wrap items-center justify-between gap-4 p-4 rounded-2xl bg-white dark:bg-[#111c11] border border-black/10 dark:border-white/10 shadow-sm">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-2xl bg-pao-green flex items-center justify-center text-2xl shadow-lg shadow-pao-green/30">
                ☘️
              </div>
              <div>
                <h1 className="text-xl md:text-2xl font-black tracking-tight flex items-center gap-2">
                  Πράσινα Νέα ☘️
                </h1>
                <p className="text-xs font-bold text-pao-green dark:text-emerald-400">
                  ΜΟΝΟ ΠΑΝΑΘΗΝΑΪΚΟΣ • LIVE RSS AGGREGATOR
                </p>
              </div>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              <button 
                onClick={handleInstallApp}
                className="px-3 py-1.5 rounded-xl bg-pao-green/10 text-pao-green dark:text-emerald-400 border border-pao-green/20 text-xs font-black hover:bg-pao-green/20 transition flex items-center gap-1.5"
              >
                <span>📱</span> Εγκατάσταση App
              </button>

              <div className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-black/5 dark:bg-white/5 text-xs font-bold border border-black/5 dark:border-white/5">
                <span>📍 {weather.city}</span>
                <span className="text-pao-green dark:text-emerald-400 font-extrabold">{weather.temp}</span>
                <span>{weather.text}</span>
              </div>

              <button 
                onClick={fetchLiveNews}
                className="px-3 py-1.5 rounded-xl bg-pao-green text-white text-xs font-bold hover:opacity-90 transition flex items-center gap-1"
              >
                🔄
              </button>

              <button 
                onClick={() => setIsDark(!isDark)}
                className="w-10 h-10 rounded-xl bg-black/5 dark:bg-white/10 flex items-center justify-center text-lg hover:scale-105 transition"
              >
                {isDark ? '☀️' : '🌙'}
              </button>
            </div>
          </header>

          {/* BANNER ΗΜΕΡΟΜΗΝΙΑΣ & ΕΟΡТОΛΟΓΙΟΥ */}
          <section className="p-4 rounded-2xl bg-gradient-to-r from-amber-500/20 via-pao-green/20 to-emerald-500/20 border-2 border-amber-400 dark:border-amber-500/60 shadow-md">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <span className="text-2xl">📅</span>
                <div>
                  <div className="text-xs font-extrabold uppercase text-amber-700 dark:text-amber-300">
                    ΣΗΜΕΡΙΝΗ ΗΜΕΡΟΜΗΝΙΑ
                  </div>
                  <div className="text-sm md:text-base font-black capitalize">
                    {formattedDate} • <span className="font-mono text-pao-green dark:text-emerald-400">{currentTime.toLocaleTimeString('el-GR')}</span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-3 p-2.5 rounded-xl bg-white/80 dark:bg-black/60 border border-amber-400/40">
                <span className="text-2xl">🎉</span>
                <div>
                  <div className="text-xs font-black uppercase text-amber-600 dark:text-amber-400">
                    ΓΙΟΡΤΑΖΟΥΝ ΣΗΜΕΡΑ:
                  </div>
                  <div className="text-sm font-extrabold text-pao-green dark:text-emerald-300">
                    {getTodayNameDays()}
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* ΦΙΛΤΡΑ & ΑΝΑΖΗΤΗΣΗ */}
          <div className="flex flex-col sm:flex-row items-center justify-between gap-3 p-3 rounded-2xl bg-white dark:bg-[#111c11] border border-black/10 dark:border-white/10">
            <div className="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
              <button 
                onClick={() => setFilter("all")}
                className={`px-4 py-2 rounded-xl text-xs font-black transition ${filter === 'all' ? 'bg-pao-green text-white' : 'bg-black/5 dark:bg-white/5'}`}
              >
                Όλα τα Πράσινα ☘️
              </button>
              <button 
                onClick={() => setFilter("football")}
                className={`px-4 py-2 rounded-xl text-xs font-black transition ${filter === 'football' ? 'bg-pao-green text-white' : 'bg-black/5 dark:bg-white/5'}`}
              >
                ⚽ Ποδόσφαιρο
              </button>
              <button 
                onClick={() => setFilter("basket")}
                className={`px-4 py-2 rounded-xl text-xs font-black transition ${filter === 'basket' ? 'bg-pao-green text-white' : 'bg-black/5 dark:bg-white/5'}`}
              >
                🏀 Μπάσκετ
              </button>
            </div>

            <input 
              type="text" 
              placeholder="Αναζήτηση ειδήσεων..."
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="w-full sm:w-64 px-4 py-2 rounded-xl bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 text-xs font-bold outline-none focus:border-pao-green"
            />
          </div>

          {/* ΛΙΣΤΑ ΕΙΔΗΣΕΩΝ */}
          <section className="space-y-3">
            {loading ? (
              <div className="text-center py-12 text-sm font-bold opacity-60">
                Αντλούνται οι τελευταίες ειδήσεις... ☘️
              </div>
            ) : filteredNews.length === 0 ? (
              <div className="text-center py-12 text-sm font-bold opacity-60">
                Δεν βρέθηκαν ειδήσεις.
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {filteredNews.map(item => (
                  <article key={item.id} className="p-4 rounded-2xl bg-white dark:bg-[#111c11] border border-black/10 dark:border-white/10 hover:border-pao-green transition flex flex-col justify-between space-y-3">
                    <div className="space-y-3">
                      <div className="relative rounded-xl overflow-hidden h-40 bg-black/10">
                        <img 
                          src={item.image} 
                          alt={item.title} 
                          className="w-full h-full object-cover hover:scale-105 transition duration-300"
                          onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=300&q=80"; }}
                        />
                        <span className="absolute top-2 left-2 px-2.5 py-0.5 rounded-full text-[10px] font-black text-white shadow" style={{ backgroundColor: item.color }}>
                          {item.source}
                        </span>
                        <span className="absolute bottom-2 right-2 px-2 py-0.5 rounded bg-black/70 text-white text-[10px] font-bold backdrop-blur">
                          {item.time}
                        </span>
                      </div>

                      <h3 className="text-sm font-extrabold leading-snug hover:text-pao-green transition">
                        <a href={item.link} target="_blank" rel="noopener noreferrer">
                          {item.title}
                        </a>
                      </h3>
                    </div>

                    <div className="pt-2 border-t border-black/5 dark:border-white/5 flex items-center justify-between text-xs font-bold">
                      <a href={item.link} target="_blank" rel="noopener noreferrer" className="text-pao-green dark:text-emerald-400 hover:underline">
                        Διάβασε →
                      </a>

                      <button 
                        onClick={() => shareOnTwitter(item.title, item.link)}
                        className="px-2.5 py-1 rounded-lg bg-black/5 dark:bg-white/10 hover:bg-sky-500 hover:text-white transition flex items-center gap-1 text-[11px] font-black"
                      >
                        <span>🐦</span> Tweet
                      </button>
                    </div>
                  </article>
                ))}
              </div>
            )}
          </section>

          {/* FOOTER */}
          <footer className="text-center py-6 text-xs font-bold opacity-50 space-y-1">
            <p>☘️ Πράσινα Νέα • Μόνο Παναθηναϊκός • 2026</p>
            <p>Live RSS Aggregator από τις κορυφαίες πράσινες πηγές</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
