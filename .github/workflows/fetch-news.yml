name: Fetch PAO news

on:
  schedule:
    - cron: "*/20 * * * *"   # κάθε 20 λεπτά
  workflow_dispatch:          # χειροκίνητη εκτέλεση από το tab Actions

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch feeds
        run: node scripts/fetch-news.js

      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update news.json"
            git push
          fi
